<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin — ISKCON Rajampet</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="wrap">
    <h1>Site Admin</h1>
    <p>Use this page from your phone to upload photos and add events. The updates will appear on the live website.</p>

    <section class="panel">
      <h2>Upload Photos to Gallery</h2>
      <form id="photoForm">
        <label>Photo name / caption</label>
        <input name="name" placeholder="e.g. Deity Darshan" required />
        <label>Short description</label>
        <textarea name="caption" placeholder="Short description"></textarea>
        <label>Select one or more photos</label>
        <input type="file" name="photos" accept="image/*" multiple required />
        <button type="submit">Upload Photos</button>
      </form>
      <div id="photoResult" class="result"></div>
    </section>

    <section class="panel">
      <h2>Add Event</h2>
      <form id="eventForm">
        <label>Event name</label>
        <input name="name" required />
        <label>Date</label>
        <input name="date" required />
        <label>Time</label>
        <input name="time" />
        <label>Place</label>
        <input name="place" />
        <label>Description</label>
        <textarea name="description"></textarea>
        <button type="submit">Save Event</button>
      </form>
      <div id="eventResult" class="result"></div>
    </section>

    <small>Open this page on any device with internet access to keep the website updated.</small>
  </main>

  <script>
  const photoForm = document.getElementById('photoForm');
  photoForm.addEventListener('submit', async e=>{
    e.preventDefault();
    const fd = new FormData(photoForm);
    const res = await fetch('/admin/upload-photos', {method:'POST', body: fd});
    const j = await res.json();
    document.getElementById('photoResult').innerText = JSON.stringify(j, null, 2);
  });

  const eventForm = document.getElementById('eventForm');
  eventForm.addEventListener('submit', async e=>{
    e.preventDefault();
    const fd = new FormData(eventForm);
    const res = await fetch('/admin/add-event', {method:'POST', body: fd});
    const j = await res.json();
    document.getElementById('eventResult').innerText = JSON.stringify(j, null, 2);
  });
  </script>
</body>
</html>
