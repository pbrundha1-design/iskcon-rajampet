server {
    listen 80;
    server_name iskconrajampet.org www.iskconrajampet.org;

    # Serve the main website static files directly (optional)
    root /var/www/iskcon_rajampet/main\ website;
    index index.html;

    # Admin UI (static HTML) - proxy POSTs and other methods to the Flask app
    location /admin/ {
        proxy_pass http://127.0.0.1:5000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API endpoints
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fallback for other static assets
    location /assets/ {
        alias /var/www/iskcon_rajampet/main\ website/assets/;
    }

    # Optional: redirect root to the public site index
    location = / {
        try_files /index.html =404;
    }
}
